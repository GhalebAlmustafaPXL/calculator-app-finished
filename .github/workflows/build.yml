name: Build example

on:
  push:
    branches:
    - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Bundle app into a zip
        run: zip -r app.zip . -x ".git/*" ".github/*"
        
      - name: Show the zip
        run: ls -alh app.zip
          
